random_seed: 42

time_split:
  train_end: "2025-12-31"
  validation_end: "2026-03-31"

models:
  renewal:
    target: renewal_rate
    task: rate_forecasting
    unit_of_analysis: project_month
    baseline: historical_rate
    main: binomial_logistic_regression
    binomial_logistic_c: 0.001
    selected: historical_rate_baseline
    metrics:
      - weighted_mae
      - weighted_rmse
      - binomial_log_loss
  rental_price:
    target: rent
    task: regression
    baseline: linear_regression
    main: catboost_regressor
  lease_probability:
    target: leased_within_4_weeks
    task: binary_classification
    horizon_weeks: 4
    baseline: logistic_regression
    main: catboost_classifier
    selected: catboost_classifier
    selection_metric: log_loss
    catboost_iterations: 300
    catboost_depth: 6
    catboost_learning_rate: 0.05
    metrics:
      - roc_auc
      - average_precision
      - log_loss
      - balanced_accuracy
      - f1
  weeks_on_market:
    target: weeks_on_market
    task: regression
    baseline: linear_regression
    main: catboost_regressor
