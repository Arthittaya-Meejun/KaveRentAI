random_seed: 42

time_split:
  train_end: "2025-12-31"
  validation_end: "2026-03-31"

models:
  rental_price:
    target: rent
    task: regression
    baseline: linear_regression
    main: catboost_regressor
  time_to_lease:
    target: weeks_on_market
    task: regression
    baseline: linear_regression
    main: random_forest_regressor
    selection_metric: mae
    evaluation:
      train_end: "2024-12-31"
      validation_end: "2025-03-31"
      test_end: "2025-06-30"
      minimum_follow_up_weeks: 52
    metrics:
      - mae
      - rmse
      - r2
